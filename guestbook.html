<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>방명록 — My Garden</title><link rel="stylesheet" href="style.css"></head><body><header class="container"><a class="logo" href="index.html"><span class="logo-mark">❧</span> My Garden</a><nav><a href="index.html">홈</a><a href="about.html">자기소개</a><a href="works.html">작품소개</a><a class="active" href="guestbook.html">방명록</a></nav></header><main class="container"><section class="page-title"><div class="kicker">GUESTBOOK</div><h1>방명록</h1><p>잠시 머물러 주셔서 감사합니다. 여러분의 소중한 한마디를 남겨주세요.</p></section><section class="content guest-layout"><form class="form-card" id="guestForm"><h2>Leave a little note</h2><div class="field"><label for="name">이름</label><input id="name" name="name" placeholder="이름을 입력해주세요" maxlength="30" required></div><div class="field"><label for="message">메시지</label><textarea id="message" name="message" placeholder="따뜻한 한마디를 남겨주세요." maxlength="500" required></textarea></div><button class="submit" type="submit">등록하기　→</button></form><section class="messages"><h2>방문자 메시지</h2><div id="messageList"><p style="font-size:13px;color:#8a9084">첫 번째 인사를 남겨주세요. 🌿</p></div></section></section></main><footer class="container"><span>MY GARDEN · GUESTBOOK</span><span>Green life, better days</span></footer><script>
const key='myGardenGuestbook';const list=document.getElementById('messageList');let entries=[];try{entries=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
function render(){list.innerHTML='';if(!entries.length){list.innerHTML='<p style="font-size:13px;color:#8a9084">첫 번째 인사를 남겨주세요. 🌿</p>';return}entries.slice().reverse().forEach(item=>{const el=document.createElement('article');el.className='message';const head=document.createElement('div');const name=document.createElement('strong');name.textContent=item.name;const date=document.createElement('small');date.textContent=item.date;const p=document.createElement('p');p.textContent=item.message;head.append(name,date);el.append(head,p);list.append(el)})}
document.getElementById('guestForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),message=document.getElementById('message').value.trim();if(!name||!message)return;entries.push({name,message,date:new Date().toLocaleDateString('ko-KR')});try{localStorage.setItem(key,JSON.stringify(entries))}catch(e){}e.target.reset();render()});render();
</script></body></html>
